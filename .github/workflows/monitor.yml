name: Monitor

# Раз в час, снаружи: сайт отвечает, а бот достучивается до Telegram через локальный
# сервер Bot API и туннель. Упавший прогон и есть алерт: GitHub шлёт письмо тому,
# кто последним менял расписание ниже. После 60 дней без коммитов GitHub ставит
# расписание на паузу, и тогда workflow приходится заново включать
# на вкладке Actions.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: monitor
  cancel-in-progress: true

permissions: {}

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # три попытки с интервалом в минуту: деплой перезапускает контейнеры, и это не авария
      - name: Site
        run: |
          for i in 1 2 3; do
            curl -fsS -o /dev/null --max-time 20 https://sublya.aimuzov.online/ && exit 0
            sleep 60
          done
          exit 1

      - name: Bot
        run: |
          for i in 1 2 3; do
            curl -fsS --max-time 20 https://sublya.aimuzov.online/admin/api/health && exit 0
            sleep 60
          done
          exit 1
