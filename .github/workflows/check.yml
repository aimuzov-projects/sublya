name: Check

# На main эти проверки вызывает деплой перед выкаткой,
# так что отдельный прогон там был бы дублем.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ffmpeg в Ubuntu собран с libass, поэтому тесты рендера бота тоже прогоняются.
      - uses: aimuzov-projects/infra-site-kit/check@v1
        with:
          apt-packages: ffmpeg
