name: Check

# On main the deploy workflow calls these checks before shipping,
# so a separate run there would be a duplicate.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm
      # Ubuntu's ffmpeg is built with libass, so the bot's render tests run too.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint:js
      - run: npm run lint:css
      - run: npm run check
      - run: npm test
      # The site is built on the server, but it's better for the build to fail here.
      - run: npm run build
