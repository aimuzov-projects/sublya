name: Check

# On main the deploy workflow calls these checks before shipping,
# so a separate run there would be a duplicate.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Ubuntu's ffmpeg is built with libass, so the bot's render tests run too.
      - uses: aimuzov-projects/infra-site-kit/check@v1
        with:
          apt-packages: ffmpeg
