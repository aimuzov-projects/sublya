name: Check

# На main эти проверки вызывает деплой перед выкаткой,
# так что отдельный прогон там был бы дублем.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # ffmpeg в Ubuntu собран с libass, поэтому тесты рендера бота тоже прогоняются.
      - uses: aimuzov-projects/infra-site-kit/check@v1
        with:
          apt-packages: ffmpeg
      # e2e из infra-site-kit: сборка в Chromium. Браузер кэшируется по версии Playwright,
      # его системные библиотеки ставятся из apt каждый прогон.
      - id: playwright
        run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
