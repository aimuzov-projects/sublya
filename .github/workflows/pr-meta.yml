name: PR meta

# Назначает PR и вешает метки по заголовку, логика живёт в aimuzov-projects/.github.
# pull_request_target нужен, чтобы PR от Renovate получали токен с правом записи;
# из самого PR ничего не чекаутится и не запускается.
on:
  pull_request_target:
    types: [opened, reopened, edited]

permissions:
  pull-requests: write
  issues: write

jobs:
  meta:
    # Ссылка на @main плавает намеренно: .github и сайты у одного владельца,
    # релизы с тегами ради одного workflow не заводим.
    uses: aimuzov-projects/.github/.github/workflows/pr-meta.yml@main
