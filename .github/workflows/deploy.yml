name: Deploy

# Мерж в main только обновляет релизный PR. Мерж этого PR выпускает релиз,
# и релиз уезжает на сервер. Ручной запуск деплоит любой релизный тег, например
# чтобы откатиться.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy, e.g. v1.2.0. Empty deploys the newest main.
        required: false

# Деплои идут по одному, новый не прерывает уже начатую сборку.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      created: ${{ steps.release.outputs.created }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - id: release
        uses: aimuzov-projects/infra-site-kit/release@v2

  check:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/check.yml

  # Пока сервер не готов (ключ, клон в /srv, сайт в Caddy), деплой пропускается.
  # Включается переменной репозитория DEPLOY_ENABLED=true.
  deploy:
    needs: [release, check]
    # `!cancelled()`, а не `always()`: job идёт и при пропущенных release и check
    # (ручной запуск), но отменённый прогон не деплоит.
    if: >-
      !cancelled() && vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || needs.check.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://sublya.aimuzov.online
    steps:
      - uses: aimuzov-projects/infra-site-kit/deploy@v2
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          url: https://sublya.aimuzov.online/
          ref: ${{ needs.release.outputs.tag || inputs.tag }}

      # Своего адреса у бота нет: его health-check отвечает через Caddy, а до Telegram
      # достучивается через локальный сервер Bot API и туннель.
      - name: Check bot
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS https://sublya.aimuzov.online/admin/api/health && exit 0
            sleep 5
          done
          exit 1
