name: Deploy

# A merge into main only updates the release PR. Merging that PR cuts a release,
# and the release goes to the server. A manual run deploys any release tag, e.g. to
# roll back.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy, e.g. v1.2.0. Empty deploys the newest main.
        required: false

# Deploys run one by one, a new one doesn't abort a build that has already started.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      created: ${{ steps.release.outputs.created }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - id: release
        uses: aimuzov-projects/infra-site-kit/release@v1

  check:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/check.yml

  # Until the server is ready (key, clone in /srv, site in Caddy), the deploy is skipped.
  # It's enabled by the repo variable DEPLOY_ENABLED=true.
  deploy:
    needs: [release, check]
    if: >-
      always() && vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || needs.check.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://sublya.aimuzov.online
    steps:
      - uses: aimuzov-projects/infra-site-kit/deploy@v1
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          url: https://sublya.aimuzov.online/
          ref: ${{ needs.release.outputs.tag || inputs.tag }}

      # The bot has no address of its own; its health check answers through Caddy and reaches
      # Telegram through the local Bot API server and the tunnel.
      - name: Check bot
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS https://sublya.aimuzov.online/admin/api/health && exit 0
            sleep 5
          done
          exit 1
