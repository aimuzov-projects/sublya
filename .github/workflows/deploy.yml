name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys run one by one, a new one doesn't abort a build that has already started.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  # Until the server is ready (key, clone in /srv, site in Caddy), the deploy is skipped.
  # It's enabled by the repo variable DEPLOY_ENABLED=true.
  deploy:
    needs: check
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://sublya.aimuzov.online
    steps:
      # The server knows what to do: the key in authorized_keys is bound to deploy/remote.sh,
      # so we don't pass a command to ssh.
      - name: Deploy on server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOST: '185.219.43.208 ssh-rsa '
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOST" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes root@185.219.43.208

      - name: Check site
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS -o /dev/null -w "%{http_code}\n" https://sublya.aimuzov.online/ && exit 0
            sleep 5
          done
          exit 1

      # The bot has no address of its own; the admin panel answering through Caddy means
      # the container is up and its web server started.
      - name: Check bot
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS -o /dev/null -w "%{http_code}\n" https://sublya.aimuzov.online/admin && exit 0
            sleep 5
          done
          exit 1
