# nginx внутри контейнера sublya-site. TLS, сжатие и домен живут на общем Caddy,
# запросы приходят сюда по сети edge уже расшифрованными.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    # За прокси абсолютный редирект вёл бы на http://sublya-site,
    # поэтому отдаём относительный.
    absolute_redirect off;
    error_page 404 /404.html;

    # Ассеты Astro с хешем в имени никогда не меняются, поэтому кешируем навсегда.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
