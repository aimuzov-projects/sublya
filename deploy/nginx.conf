# nginx inside the sublya-site container. TLS, compression and the domain are on
# the shared Caddy, requests come here over the edge network already decrypted.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    # Behind the proxy an absolute redirect would point to http://sublya-site,
    # so we send a relative one.
    absolute_redirect off;
    error_page 404 /404.html;

    # Hashed Astro assets never change, so they're cached forever.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
