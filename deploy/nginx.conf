# nginx inside the sublya-site container. TLS, compression and the domain belong to the shared
# Caddy, requests arrive here over the edge network already decrypted.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    # behind the proxy an absolute redirect would point at http://sublya-site
    absolute_redirect off;

    # CSS, JS and fonts carry a hash in their names and never change under it
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # the page itself and the videos keep their names, so browsers ask again every time;
    # a video URL also carries its version, and an unchanged file costs a 304
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
