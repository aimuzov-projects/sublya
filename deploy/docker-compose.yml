# Прод, на сервере проектов. Порты 80/443 принадлежат общему Caddy из
# aimuzov/infra-server: он проксирует sublya.aimuzov.online на сайт, а
# /admin -- на админку бота, и то и другое через сеть edge.
#
# С сервера напрямую до Telegram и OpenRouter не достучаться, поэтому бот и сервер
# Bot API делят сетевое пространство имён контейнера tun2socks, который заворачивает
# весь их исходящий трафик в общий VPN-выход из infra-server (SOCKS на vpn:1080).
# Ни один из них о прокси не знает.
#
# deploy/site.sh из infra-server пересобирает всё на каждый релиз,
# секреты лежат в /srv/sublya/.env.

name: sublya

x-logging: &logging
  driver: json-file
  options:
    max-size: '5m'
    max-file: '2'

services:
  site:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      secrets: [env]
    image: sublya-site
    container_name: sublya-site
    restart: unless-stopped
    networks:
      - edge
    logging: *logging

  tunnel:
    image: xjasonlyu/tun2socks:v2.6.0
    container_name: sublya-tunnel
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      PROXY: socks5://vpn:1080
      LOGLEVEL: warn
    # общий Caddy ходит в админку бота (порт 8090) через edge; ответы ему, как и трафик
    # к vpn, уходят по собственному маршруту сети, а не в туннель
    networks:
      - vpn
      - edge
    logging: *logging

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: sublya-bot-api
    restart: unless-stopped
    network_mode: service:tunnel
    # отсюда берутся TELEGRAM_API_ID и TELEGRAM_API_HASH; compose-файл лежит в deploy/,
    # поэтому ${...} искал бы свой .env рядом с ним, а не в корне репозитория
    env_file: ../.env
    environment:
      TELEGRAM_LOCAL: '1'
      TELEGRAM_HTTP_IP_ADDRESS: 127.0.0.1
    volumes:
      - bot-api:/var/lib/telegram-bot-api
    depends_on:
      - tunnel
    logging: *logging

  bot:
    build:
      context: ..
      dockerfile: deploy/bot.Dockerfile
    image: sublya-bot
    container_name: sublya-bot
    restart: unless-stopped
    network_mode: service:tunnel
    env_file: ../.env
    environment:
      TELEGRAM_API_URL: http://127.0.0.1:8081
      DATA_DIR: /data
    volumes:
      - ../data:/data
      # тот же путь, что и в контейнере Bot API, поэтому его пути к файлам
      # работают как есть
      - bot-api:/var/lib/telegram-bot-api
    depends_on:
      - telegram-bot-api
    logging: *logging

# Переменные сборки и секреты бота лежат в /srv/sublya/.env, образец -- .env.example.
secrets:
  env:
    file: ../.env

volumes:
  # здесь хранится логин бота на локальном сервере Bot API; имя осталось с тех времён,
  # когда у бота был свой репозиторий, и сохранено, чтобы серверу не пришлось логинить
  # его заново
  bot-api:
    name: sublya-bot_bot-api
    external: true

networks:
  vpn:
    name: vpn
    external: true
  edge:
    name: edge
    external: true
