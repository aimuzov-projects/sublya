name: test

# On main the deploy calls the tests before shipping, a separate run there would be a second one.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ubuntu's ffmpeg is built with libass, so the render tests run too
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest
