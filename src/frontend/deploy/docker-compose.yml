# The site on the projects server. Ports 80/443 belong to the shared Caddy from
# aimuzov-projects/infra-server: it proxies sublya.aimuzov.online here over the edge network.
# deploy/remote.sh rebuilds it on every push to main.

name: sublya-site

services:
  site:
    build:
      context: ..
    image: sublya-site
    container_name: sublya-site
    restart: unless-stopped
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'

networks:
  edge:
    name: edge
    external: true
