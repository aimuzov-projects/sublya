# The fallback: the built site on the skator.ru server, for when GitHub Pages can't serve it.
# The server's Caddy (skator project) owns ports 80/443 and proxies sublya.aimuzov.online here
# over the skator_default network. deploy/vps.sh uploads dist/ next to this file.

services:
  site:
    image: nginx:1.29-alpine
    container_name: sublya-site
    restart: unless-stopped
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - skator
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'

networks:
  skator:
    name: skator_default
    external: true
