name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys go one after another, a new one doesn't cut off a build already running.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A broken build fails on the server before the old container is touched, and pages.yml
  # builds the same sources, so there's no separate check here.
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://sublya.aimuzov.online
    steps:
      # The server knows what to do: the key in authorized_keys is bound to deploy/remote.sh,
      # so ssh gets no command.
      - name: Deploy on server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOST: '185.219.43.208 ssh-rsa '
          printf '%s\n' "$KNOWN_HOST" > ~/.ssh/known_hosts
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOST" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes root@185.219.43.208

      - name: Check site
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS -o /dev/null -w "%{http_code}\n" https://sublya.aimuzov.online/ && exit 0
            sleep 5
          done
          exit 1
