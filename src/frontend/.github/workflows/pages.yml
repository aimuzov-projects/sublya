name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # only the page itself goes out, not the demo tooling or the README
      - name: Collect the site
        run: |
          mkdir _site
          cp -r index.html style.css app.js favicon.svg fonts media _site/
          echo sublya.aimuzov.online > _site/CNAME
          # Pages caches everything for 10 minutes and takes no headers from us, so CSS and JS
          # get the commit in their URL: a deploy never meets a stale copy in a browser
          sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
