server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # nothing here has a hashed name: without this, browsers guess a lifetime and keep
    # the old CSS, JS and videos after a deploy. Asking again costs a 304.
    add_header Cache-Control "no-cache";

    location / {
        try_files $uri $uri/ =404;
    }
}
