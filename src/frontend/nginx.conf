server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
    }

    # the demo is rebuilt under the same names, so browsers ask again every time;
    # an unchanged video costs a 304
    location /media/ {
        add_header Cache-Control "no-cache";
    }
}
