services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?}
      TELEGRAM_LOCAL: '1'
    volumes:
      - bot-api:/var/lib/telegram-bot-api

  bot:
    build:
      context: .
      dockerfile: deploy/bot.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      TELEGRAM_API_URL: http://telegram-bot-api:8081
      DATA_DIR: /data
    volumes:
      - ./data:/data
      # Монтируем по тому же пути, тогда пути к файлам от сервера Bot API работают как есть.
      - bot-api:/var/lib/telegram-bot-api
    depends_on:
      - telegram-bot-api

volumes:
  bot-api:
